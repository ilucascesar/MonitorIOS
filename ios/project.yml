# Definição do projeto Xcode (XcodeGen). O .xcodeproj é gerado no CI com `xcodegen generate`
# (ou num Mac com `brew install xcodegen && xcodegen`). Isso evita editar/mesclar project.pbxproj
# à mão, já que o desenvolvimento do dia a dia não usa um Mac.
name: MonitorIOS
options:
  bundleIdPrefix: com.monitorios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  MonitorIOS:
    type: application
    platform: iOS
    sources:
      - path: MonitorIOS
    info:
      path: MonitorIOS/Info.plist
      properties:
        CFBundleDisplayName: Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # O servidor fica numa VPN privada (Tailscale) e por padrão usa HTTP. Ver docs/SEGURANCA.md.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: O app acessa o servidor de câmeras na sua rede local ou via Tailscale para exibir vídeo ao vivo e gravações.
        NSPhotoLibraryAddUsageDescription: Para salvar capturas de tela e trechos de vídeo exportados na sua fototeca.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monitorios.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  MonitorIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonitorIOSTests
    dependencies:
      - target: MonitorIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.monitorios.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MonitorIOS.app/MonitorIOS
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MonitorIOS:
    build:
      targets:
        MonitorIOS: all
        MonitorIOSTests: [test]
    test:
      config: Debug
      targets:
        - MonitorIOSTests
    archive:
      config: Release
