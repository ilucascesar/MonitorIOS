# Testes do servidor no Windows (mesmo SO da instalação real).
# Os testes de integração usam FFmpeg com vídeo sintético gerado localmente (testsrc2) apenas para
# exercitar gravação/índice/exportação; nenhuma câmera real é necessária no CI.
name: Servidor

on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Testes
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          ffmpeg -hide_banner -version | Select-Object -First 1
          python -m pytest -q -rs
