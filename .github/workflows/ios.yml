# Compila o app iOS num runner macOS (não há Mac no ambiente de desenvolvimento).
#
# Sempre gera:  MonitorIOS-unsigned.ipa  (sem assinatura; o iLoader/AltStore/SideStore assina na
#               instalação com o seu Apple ID).
# Opcional:     MonitorIOS-signed.ipa    (somente se os segredos de assinatura existirem; ver docs/IOS.md).
#
# Um IPA sem assinatura NÃO instala diretamente no iPhone: alguém precisa assiná-lo.
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode (padrão do runner, iOS SDK 17+)
        run: xcodebuild -version

      - name: Gerar projeto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar Release sem assinatura
        run: |
          set -o pipefail
          xcodebuild build \
            -project MonitorIOS.xcodeproj -scheme MonitorIOS -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-release.log | grep -E "error:|\*\* " || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-release.log
          rm -rf Payload && mkdir Payload
          cp -R build/release/Build/Products/Release-iphoneos/MonitorIOS.app Payload/
          zip -qry MonitorIOS-unsigned.ipa Payload
          ls -lh MonitorIOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorIOS-unsigned-ipa
          path: ios/MonitorIOS-unsigned.ipa
          retention-days: 30

      # Depois do IPA: uma falha de teste não impede o download do app.
      - name: Testes unitários (simulador)
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulador: $UDID"
          set -o pipefail
          xcodebuild test \
            -project MonitorIOS.xcodeproj -scheme MonitorIOS \
            -destination "id=$UDID" \
            -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|Test Case.*failed|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: ios/build-*.log

      # ---------- Assinatura opcional (conta Apple Developer + perfil de provisionamento) ----------
      - name: Importar certificado e perfil
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            METHOD=debugging   # perfil de desenvolvimento/ad hoc com lista de aparelhos
            /usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$RUNNER_TEMP/profile.plist" | grep -q false && METHOD=release-testing
          else
            METHOD=app-store-connect
          fi
          {
            echo "PROFILE_NAME=$NAME"
            echo "TEAM_ID=$TEAM"
            echo "BUNDLE_ID=${APPID#*.}"
            echo "EXPORT_METHOD=$METHOD"
          } >> "$GITHUB_ENV"

      - name: Arquivar e exportar IPA assinado
        if: env.HAS_SIGNING == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MonitorIOS.xcodeproj -scheme MonitorIOS -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/MonitorIOS.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" | tee build-archive.log | grep -E "error:|\*\* " || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-archive.log
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/MonitorIOS.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          mv build/export/*.ipa MonitorIOS-signed.ipa

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: MonitorIOS-signed-ipa
          path: ios/MonitorIOS-signed.ipa
          retention-days: 30

      - name: Limpar keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
